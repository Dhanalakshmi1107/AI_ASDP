<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI-Based Attack Surface Discovery Platform</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: white;
    margin: 0;
    padding: 0;
}

.container {
    width: 500px;
    margin: 150px auto;
    text-align: center;
}

h1 {
    font-size: 22px;
    margin-bottom: 30px;
}

input {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    margin-bottom: 15px;
}

button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}

#status {
    margin-top: 20px;
    font-size: 14px;
    color: gray;
}
</style>
</head>

<body>

<div class="container">

<h1>AI-Based Attack Surface Discovery Platform</h1>

<input type="text" id="targetUrl" placeholder="Enter target domain (example.com)">

<button onclick="startScan()">Start Scan</button>

<div id="status"></div>

</div>

<script>

function startScan() {

    const url = document.getElementById("targetUrl").value;

    if (!url) {
        alert("Please enter a target domain.");
        return;
    }

    document.getElementById("status").innerText = "Scan initiated...";

    fetch("/scan", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ target: url })
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("status").innerText = "Scan started successfully.";
    })
    .catch(err => {
        document.getElementById("status").innerText = "Error starting scan.";
    });
}

</script>

</body>
</html>
